[options]
# ---------------------------------------------------------------------------
# Configuration de PRODUCTION du SIRH.
#
# A ne pas confondre avec config/odoo.conf, qui sert au poste de travail.
# docker-cmd.sh passe l'hote, l'utilisateur, le mot de passe et le port de la
# base en ligne de commande : ces valeurs-la priment sur ce fichier. Tout le
# reste (mot de passe maitre, exposition des bases, processus, limites) est
# lu ici, et c'est precisement ce qui distingue une instance de developpement
# d'une instance exposee sur internet.
# ---------------------------------------------------------------------------

# --- Verrous d'exposition --------------------------------------------------
# Mot de passe maitre : il autorise la creation, la suppression et le
# TELECHARGEMENT COMPLET de n'importe quelle base. A remplacer avant le
# premier demarrage :   openssl rand -base64 36
# Le script deploy/preparer_production.sh le fait pour vous.
admin_passwd = REMPLACER_AVANT_DEMARRAGE

# N'expose jamais la liste des bases. Combine a dbfilter, un visiteur ne peut
# ni decouvrir ni choisir une autre base que la sienne.
list_db = False

# Une seule base servie, nom exact. Empeche aussi la creation implicite
# d'une base au premier appel.
dbfilter = ^SIRH$

# Legitime UNIQUEMENT derriere Caddy : Odoo fait alors confiance aux en-tetes
# X-Forwarded-*. Sans proxy devant, ce reglage permet a n'importe qui de se
# faire passer pour une autre adresse et de forcer des URL en https.
proxy_mode = True

# --- Base de donnees -------------------------------------------------------
db_host = postgres
db_port = 5432
# db_user / db_password sont fournis par docker-cmd.sh depuis le .env.
# Ne les ecrivez pas ici : ce fichier est versionne, pas le .env.

# Taille du pool de connexions PostgreSQL. Avec 3 workers + 2 fils de taches
# planifiees, 32 laisse de la marge sans saturer la limite par defaut de
# PostgreSQL (100 connexions).
db_maxconn = 32

# --- Processus -------------------------------------------------------------
# Dimensionne pour 2 vCPU / 8 Go (offre Hostinger a ~8 EUR).
# Regle usuelle : workers = (nombre de vCPU x 2) + 1, moins de quoi laisser
# la place aux taches planifiees. Avec 1 vCPU, descendez a 2 workers ;
# avec 4 vCPU, montez a 9.
#
# Ce reglage n'est pas cosmetique : a workers = 0 (le defaut, et ce qui tourne
# aujourd'hui en local), Odoo est mono-processus. Une seule generation de PDF
# un peu longue bloque alors TOUS les utilisateurs pendant sa duree.
workers = 3
max_cron_threads = 2

# --- Limites par requete ---------------------------------------------------
# Un worker qui depasse la limite souple est recycle proprement apres la
# requete en cours ; la limite dure le tue immediatement. Sans elles, une
# fuite memoire finit par consommer tout le VPS.
limit_memory_soft = 1073741824
limit_memory_hard = 1342177280
limit_request = 8192

# Le rapport de presence sur un mois complet depasse largement les 60 s par
# defaut d'Odoo : il genere une quinzaine de pages via wkhtmltopdf. Des
# limites trop serres le feraient echouer sans explication utile.
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 1800

# --- Journalisation --------------------------------------------------------
log_level = warn
log_handler = :INFO
logfile = None

# --- Divers ----------------------------------------------------------------
# Les fichiers de session sur disque : conserves dans le volume odoo_data,
# donc les utilisateurs ne sont pas deconnectes a chaque redemarrage.
unaccent = True
